    <path d="M 330 390 L 198.18 553.48 A 210 210 0 0 1 144.72 488.85 Z" fill="#16a34a"/>
    <path d="M 330 390 L 144.72 488.85 A 210 210 0 0 1 122.00 418.94 Z" fill="#db2777"/>
    <path d="M 330 390 L 122.00 418.94 A 210 210 0 0 1 121.34 366.30 Z" fill="#ea580c"/>
    <path d="M 330 390 L 121.34 366.30 A 210 210 0 0 1 130.28 325.11 Z" fill="#64748b"/>
    <path d="M 330 390 L 130.28 325.11 A 210 210 0 0 1 330.00 180.00 Z" fill="#94a3b8"/>
  </g>

  <circle cx="330" cy="394" r="82" fill="#fbfaf7"/>
  <text x="330" y="381" fill="#17324d" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="760">100%</text>
  <text x="330" y="414" fill="#667085" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">total value</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#1f2933">
