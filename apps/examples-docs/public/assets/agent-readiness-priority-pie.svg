    <g transform="translate(610 370)">
      <rect width="22" height="22" rx="4" fill="#0891b2"/>
      <text x="38" y="18" font-weight="760">8%</text>
      <text x="112" y="18">Markdown alternatives</text>
    </g>
    <g transform="translate(610 414)">
      <rect width="22" height="22" rx="4" fill="#16a34a"/>
      <text x="38" y="18" font-weight="760">6.4%</text>
