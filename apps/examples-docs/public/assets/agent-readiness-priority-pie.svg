<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Practical agent readiness full value model</title>
  <desc id="desc">Pie chart showing the full practical agent readiness value model: raw fetchability 14.4%, robots crawler lanes 11.2%, passage extractability 11.2%, sitemap quality 8%, llms.txt curated map 8%, Markdown alternatives 8%, schema and canonical parity 6.4%, real capability surfaces 5.6%, llms-full context files 4%, HTTP Link discovery 3.2%, and other context-specific value 20%.</desc>
  <rect width="1200" height="720" rx="0" fill="#fbfaf7"/>
  <text x="70" y="78" fill="#17324d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760">Full 100% value model</text>
  <text x="70" y="116" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">The practical 80/20 items are shown as total value share; the rest stays context-specific.</text>

  <g transform="translate(0 4)" stroke="#fbfaf7" stroke-width="4" stroke-linejoin="round">
