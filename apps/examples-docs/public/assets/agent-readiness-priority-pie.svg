    </g>
    <g transform="translate(610 194)">
      <rect width="22" height="22" rx="4" fill="#0f766e"/>
      <text x="38" y="18" font-weight="760">11.2%</text>
      <text x="112" y="18">robots.txt with crawler lanes</text>
    </g>
    <g transform="translate(610 238)">
      <rect width="22" height="22" rx="4" fill="#b7791f"/>
      <text x="38" y="18" font-weight="760">11.2%</text>
      <text x="112" y="18">Passage extractability</text>
    </g>
    <g transform="translate(610 282)">
      <rect width="22" height="22" rx="4" fill="#b42318"/>
      <text x="38" y="18" font-weight="760">8%</text>
